name: Monthly release

on:
  schedule:
    # First day of each month at 14:00 UTC.
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build

      - name: Run smoke checks
        run: |
          python -c "import open_aws_scanner"
          python -m compileall -q open_aws_scanner

      - name: Check whether a release is needed
        id: changes
        shell: bash
        run: |
          latest_tag="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
          if [[ -z "$latest_tag" ]]; then
            echo "No previous release tag found."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "previous_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "previous_tag=$latest_tag" >> "$GITHUB_OUTPUT"

          if git diff --quiet "$latest_tag"..HEAD -- . ':!.github/workflows/monthly-release.yml'; then
            echo "No changes since $latest_tag; skipping release."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes found since $latest_tag."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.changes.outputs.needed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text()
          match = re.search(r'^version = "(\d+)\.(\d+)\.(\d+)"$', text, re.MULTILINE)
          if not match:
              raise SystemExit("Could not find a PEP 621 project version")
          major, minor, patch = map(int, match.groups())
          version = f"{major}.{minor}.{patch + 1}"
          path.write_text(
              re.sub(
                  r'^version = "\d+\.\d+\.\d+"$',
                  f'version = "{version}"',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
          )
          Path(".release-version").write_text(f"v{version}\n")
          print(f"Preparing v{version}")
          PY

      - name: Build package
        if: steps.changes.outputs.needed == 'true'
        run: python -m build

      - name: Commit and tag release
        if: steps.changes.outputs.needed == 'true'
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < .release-version)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: release ${version}"
          git tag -a "${version}" -m "Release ${version}"
          echo "tag=${version}" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        if: steps.changes.outputs.needed == 'true'
        run: git push origin "HEAD:${{ github.event.repository.default_branch }}" --follow-tags

      - name: Create GitHub Release
        if: steps.changes.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "open-aws-scanner ${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Email release summary through contact API
        if: steps.changes.outputs.needed == 'true'
        env:
          CONTACT_ALERT_API_URL: ${{ secrets.CONTACT_ALERT_API_URL }}
          CONTACT_ALERT_SECRET: ${{ secrets.CONTACT_ALERT_SECRET }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.changes.outputs.previous_tag }}
        shell: bash
        run: |
          if [[ -z "$CONTACT_ALERT_API_URL" || -z "$CONTACT_ALERT_SECRET" ]]; then
            echo "CONTACT_ALERT_API_URL and CONTACT_ALERT_SECRET must be configured as repository secrets."
            exit 1
          fi

          changes="$(if [[ -n "$PREVIOUS_TAG" ]]; then git log --format='- %h %s' "${PREVIOUS_TAG}..HEAD"; else git log --format='- %h %s' -10; fi)"
          files="$(if [[ -n "$PREVIOUS_TAG" ]]; then git diff --name-status "${PREVIOUS_TAG}..HEAD"; else git diff-tree --no-commit-id --name-status -r HEAD; fi)"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          message="$(printf 'open-AWS-scanner monthly release %s\n\nRelease: %s\n\nChanges:\n%s\n\nFiles changed:\n%s' "$RELEASE_TAG" "$release_url" "${changes:-No commit details available.}" "${files:-No file details available.}")"
          payload="$(jq -n --arg subject "open-AWS-scanner ${RELEASE_TAG} released" --arg message "$message" '{subject: $subject, message: $message}')"

          curl --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --header "X-CBP-Alert-Secret: ${CONTACT_ALERT_SECRET}" \
            --data "$payload" \
            "$CONTACT_ALERT_API_URL"
