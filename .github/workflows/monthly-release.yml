name: Monthly release

on:
  schedule:
    # First day of each month at 14:00 UTC.
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build

      - name: Run smoke checks
        run: |
          python -c "import open_aws_scanner"
          python -m compileall -q open_aws_scanner

      - name: Check whether a release is needed
        id: changes
        shell: bash
        run: |
          latest_tag="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
          if [[ -z "$latest_tag" ]]; then
            echo "No previous release tag found."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$latest_tag"..HEAD -- . ':!.github/workflows/monthly-release.yml'; then
            echo "No changes since $latest_tag; skipping release."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes found since $latest_tag."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.changes.outputs.needed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text()
          match = re.search(r'^version = "(\d+)\.(\d+)\.(\d+)"$', text, re.MULTILINE)
          if not match:
              raise SystemExit("Could not find a PEP 621 project version")
          major, minor, patch = map(int, match.groups())
          version = f"{major}.{minor}.{patch + 1}"
          path.write_text(
              re.sub(
                  r'^version = "\d+\.\d+\.\d+"$',
                  f'version = "{version}"',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
          )
          Path(".release-version").write_text(f"v{version}\n")
          print(f"Preparing v{version}")
          PY

      - name: Build package
        if: steps.changes.outputs.needed == 'true'
        run: python -m build

      - name: Commit and tag release
        if: steps.changes.outputs.needed == 'true'
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < .release-version)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: release ${version}"
          git tag -a "${version}" -m "Release ${version}"
          echo "tag=${version}" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        if: steps.changes.outputs.needed == 'true'
        run: git push origin "HEAD:${{ github.event.repository.default_branch }}" --follow-tags

      - name: Create GitHub Release
        if: steps.changes.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "open-aws-scanner ${{ steps.version.outputs.tag }}" \
            --generate-notes
